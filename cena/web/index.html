<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000"><meta name="description" content="CENA: fotografe uma capa e organize sua próxima sessão.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://image.tmdb.org https://upload.wikimedia.org https://images.metahub.space https://m.media-amazon.com; connect-src 'self' http: https:; object-src 'none'; base-uri 'none'; frame-src 'none'">
  <title>CENA · Seu próximo play</title>
  <link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="editorial.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app">
    <header><div class="brand-group"><a class="brand" href="#home" aria-label="CENA IA, início"><span class="brand-triangle" aria-hidden="true"><picture><source media="(prefers-reduced-motion: reduce)" srcset="brand-still.webp"><source type="image/webp" srcset="brand-loop.webp"><img src="brand-mark.png" alt=""></picture></span><img class="brand-wordmark" src="brand-wordmark.svg" alt=""></a><span class="version-tag" id="app-version">v0.28.21</span></div><div class="header-tools"><button class="icon-button" id="profile-shortcut" aria-label="Perfil e configurações"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2"/></svg><span>Perfil</span></button><button class="icon-button" id="search-shortcut" aria-label="Buscar títulos"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button></div></header>
    <main id="main"></main>
    <nav aria-label="Navegação principal">
      <button data-tab="home" class="active"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/></svg></span>Início</button>
      <button data-tab="library"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg></span>Minha lista</button>
      <button data-tab="scan" class="camera-nav" aria-label="Fotografar capa"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="13" r="3"/></svg></span><small>Capturar</small></button>
      <button data-tab="discover" aria-label="Descobrir filmes e séries"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m16 8-3 5-5 3 3-5z"/></svg></span>Descobrir</button>
      <button data-tab="profile" aria-label="Estatísticas"><span aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11h4v9M10 20V4h4v16M16 20v-13h4v13"/></svg></span>Estatísticas</button>
    </nav>
  </div>
  <dialog id="detail"><button class="close" aria-label="Fechar">×</button><div id="detail-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="photo-input" type="file" accept="image/*" capture="environment" hidden>
</body>
</html>
