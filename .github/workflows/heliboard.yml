name: Testar base HeliBoard
on:
  push:
    branches: [main]
    paths: ['heliboard/**', '.github/workflows/heliboard.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HeliBorg/HeliBoard
          ref: f8ec91a982835911cc224fa99434c3396d4cd562
          path: heli-source
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 0ec4027a2a0183de87c007069adddc06e665f7de
          path: heli-source/ai-native/llama.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.0.13004108'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: teclado-br-heli-test-signing-v2
      - name: Restaurar assinatura de teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 heliboard/signing.py
      - name: Guardar backup privado da assinatura de teste
        uses: actions/upload-artifact@v4
        with:
          name: teclado-br-heli-chave-teste-v1
          path: |
            ~/.android/debug.keystore
            heli-artifacts/signing-cert.sha256
          retention-days: 90
          include-hidden-files: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar variante brasileira e fontes correspondentes
        run: |
          python3 heliboard/prepare.py heli-source
          mkdir -p heli-artifacts
          tar --exclude=.git --exclude=build --exclude=.gradle --exclude=ai-build -czf heli-artifacts/teclado-br-heli-fontes.tar.gz -C heli-source .
      - name: Compilar motor offline para Android
        run: bash heliboard/ai/build-native.sh heli-source
      - name: Testar e compilar a base
        working-directory: heli-source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testRunTestsUnitTest assembleDebugNoMinify
      - name: Conferir certificado do APK
        run: python3 heliboard/verify_signing.py
      - name: Guardar testes unitários
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teclado-br-heli-unitarios
          path: heli-source/app/build/reports/tests/
      - name: Guardar APK compilado e fontes
        uses: actions/upload-artifact@v4
        with:
          name: teclado-br-heli-compilado
          path: |
            heli-source/app/build/outputs/apk/debugNoMinify/*.apk
            heli-artifacts/teclado-br-heli-fontes.tar.gz
            heli-artifacts/signing-cert.sha256
      - name: Guardar APK separado
        uses: actions/upload-artifact@v4
        with:
          name: teclado-br-heli-apk
          path: heli-source/app/build/outputs/apk/debugNoMinify/*.apk
      - name: Guardar fontes separadas
        uses: actions/upload-artifact@v4
        with:
          name: teclado-br-heli-fontes
          path: heli-artifacts/teclado-br-heli-fontes.tar.gz
  interaction:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: teclado-br-heli-compilado
          path: heli-package
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Baixar fixture sintética para teste offline
        run: |
          curl --fail --location --retry 3 --output /tmp/qwen-smoke.gguf 'https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/23749fefcc72300e3a2ad315e1317431b06b590a/Qwen3-0.6B-Q8_0.gguf?download=true'
          echo '9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031  /tmp/qwen-smoke.gguf' | sha256sum -c -
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_5
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            adb shell wm size 540x1170
            adb shell wm density 220
            adb install -r $(find heli-package -name '*.apk' -print -quit)
            python3 heliboard/smoke.py
      - name: Guardar diagnóstico
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teclado-br-heli-testes
          path: heli-results/
      - name: Guardar APK verificado e fontes
        uses: actions/upload-artifact@v4
        with:
          name: teclado-br-heli-apk-e-fontes
          path: heli-package/
