name: CENA Android APK

on:
  push:
    branches: [main, 'cena/**']
    paths: ['cena/**', 'android/**', 'web/**', 'server/**', 'tests/**', 'package.json', '.github/workflows/cena-android.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cena-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Find CENA source
        id: source
        shell: bash
        run: |
          if [ -f cena/android/settings.gradle.kts ]; then
            echo 'directory=cena' >> "$GITHUB_OUTPUT"
          elif [ -f android/settings.gradle.kts ]; then
            echo 'directory=.' >> "$GITHUB_OUTPUT"
          else
            echo 'CENA source directory is missing.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify server and local storage
        working-directory: ${{ steps.source.outputs.directory }}
        run: |
          npm run check
          npm test
          node scripts/check-cover-identification.mjs
      - name: Verify live SISU movie lookup
        working-directory: ${{ steps.source.outputs.directory }}
        run: node scripts/check-public-search.mjs
      - name: Bundle and validate free on-device visual model
        working-directory: ${{ steps.source.outputs.directory }}
        run: |
          python3 scripts/prepare-vision-model.py
          python3 -m venv /tmp/cena-vision
          /tmp/cena-vision/bin/pip install --quiet onnxruntime==1.22.0 pillow numpy
          /tmp/cena-vision/bin/python scripts/check-vision-model.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore persistent private preview signing identity
        env:
          GH_TOKEN: ${{ github.token }}
          CENA_KEYSTORE_PATH: ${{ runner.temp }}/cena-signing/cena-preview.keystore
        run: bash "${{ steps.source.outputs.directory }}/scripts/prepare-signing.sh" initialize
      - name: Build installable preview APK
        working-directory: ${{ steps.source.outputs.directory }}/android
        env:
          CENA_KEYSTORE_PATH: ${{ runner.temp }}/cena-signing/cena-preview.keystore
        run: gradle --no-daemon assembleDebug
      - name: Validate the actual packaged UI and version
        working-directory: ${{ steps.source.outputs.directory }}
        run: python3 scripts/check-packaged-apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Name APK and checksum
        env:
          SOURCE_DIRECTORY: ${{ steps.source.outputs.directory }}
        run: |
          mkdir -p entrega
          cp "$SOURCE_DIRECTORY/android/app/build/outputs/apk/debug/app-debug.apk" entrega/CENA-0.7.0.apk
          cd entrega
          sha256sum CENA-0.7.0.apk > CENA-0.7.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CENA-Android-0.7.0
          path: entrega/*
          retention-days: 30
          if-no-files-found: error
      - name: Download instructions
        run: |
          echo '### CENA Android' >> "$GITHUB_STEP_SUMMARY"
          echo 'Baixe o artefato CENA-Android-0.7.0 ao final desta página, extraia o ZIP no celular e abra CENA-0.7.0.apk.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Versão 0.7.0: novo Story com fundo inspirado na capa, título localizado, nota pessoal em selo, opinião maior e assinatura CENA.' >> "$GITHUB_STEP_SUMMARY"

  publish-private-preview:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require Android integration and browser validation before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=30" --jq '.workflow_runs[] | select(.name == "CENA local visual AI on Android" or .name == "CENA live mobile browser QA") | [.status, (.conclusion // "pending")] | join(" ")')
            if [ "$(printf '%s\n' "$result" | grep -c '^completed success$')" = 2 ]; then exit 0; fi
            if printf '%s\n' "$result" | grep -Eq '^completed (failure|cancelled|timed_out|action_required)$'; then echo "Validation: $result"; exit 1; fi
            sleep 15
          done
          echo 'Android validation did not finish in time.'
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: CENA-Android-0.7.0
          path: entrega
      - name: Publish direct APK download in the private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh repo view "$GITHUB_REPOSITORY" --json isPrivate --jq .isPrivate)" = true
          if ! gh release view cena-v0.7.0 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create cena-v0.7.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title 'CENA 0.7.0 — atualização de teste' --notes-file cena/docs/CENA-0.7.0.md
          fi
          gh release upload cena-v0.7.0 entrega/CENA-0.7.0.apk entrega/CENA-0.7.0.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber



