name: CENA Android APK

on:
  push:
    branches: [main, 'cena/**']
    paths: ['cena/**', 'android/**', 'web/**', 'server/**', 'tests/**', 'package.json', '.github/workflows/cena-android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cena-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Find CENA source
        id: source
        shell: bash
        run: |
          if [ -f cena/android/settings.gradle.kts ]; then
            echo 'directory=cena' >> "$GITHUB_OUTPUT"
          elif [ -f android/settings.gradle.kts ]; then
            echo 'directory=.' >> "$GITHUB_OUTPUT"
          else
            echo 'CENA source directory is missing.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify server and local storage
        working-directory: ${{ steps.source.outputs.directory }}
        run: |
          npm run check
          npm test
          node scripts/check-cover-identification.mjs
      - name: Verify live SISU movie lookup
        working-directory: ${{ steps.source.outputs.directory }}
        run: node scripts/check-public-search.mjs
      - name: Bundle and validate free on-device visual model
        working-directory: ${{ steps.source.outputs.directory }}
        run: |
          python3 scripts/prepare-vision-model.py
          python3 -m venv /tmp/cena-vision
          /tmp/cena-vision/bin/pip install --quiet onnxruntime==1.22.0 pillow numpy
          /tmp/cena-vision/bin/python scripts/check-vision-model.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Keep preview signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cena-debug-signing-v1-${{ github.repository_id }}
      - name: Build installable preview APK
        working-directory: ${{ steps.source.outputs.directory }}/android
        run: gradle --no-daemon assembleDebug
      - name: Name APK and checksum
        env:
          SOURCE_DIRECTORY: ${{ steps.source.outputs.directory }}
        run: |
          mkdir -p entrega
          cp "$SOURCE_DIRECTORY/android/app/build/outputs/apk/debug/app-debug.apk" entrega/CENA-0.4.0.apk
          cd entrega
          sha256sum CENA-0.4.0.apk > CENA-0.4.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CENA-Android-0.4.0
          path: entrega/*
          retention-days: 30
          if-no-files-found: error
      - name: Download instructions
        run: |
          echo '### CENA Android' >> "$GITHUB_STEP_SUMMARY"
          echo 'Baixe o artefato CENA-Android-0.4.0 ao final desta página, extraia o ZIP no celular e abra CENA-0.4.0.apk.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Versão 0.4: IA visual local, identificação tolerante a erros e pistas do elenco, sem chave de API ou cobrança por imagem. A integração dos players depende de servidor hospedado.' >> "$GITHUB_STEP_SUMMARY"
