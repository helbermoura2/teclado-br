name: Inspect delivered CENA APK
on:
  push:
    branches: ['cena/**']
    paths: ['.github/workflows/cena-delivery-inspection.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download the exact delivered artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41269362087 --repo helbermoura2/teclado-br --name CENA-Android-0.4.0 --dir /tmp/delivered-cena
      - name: Inspect packaged interface and installed version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json, re, subprocess, os
          apk = next(Path('/tmp/delivered-cena').glob('*.apk'))
          with ZipFile(apk) as archive:
              index = archive.read('assets/index.html').decode()
              js = archive.read('assets/app.js').decode()
              print(json.dumps({'version_in_html': re.findall(r'v0[.]\\d+[.]\\d+', index), 'has_new_capture_screen': '<h1>Capturar título</h1>' in js, 'has_gallery_button': 'id="pick-image"' in js, 'has_visual_bridge_call': 'compareCovers' in js, 'model_size': archive.getinfo('assets/models/clip-vision.onnx').file_size}, ensure_ascii=False))
              print('Packaged index header:', index[index.index('<header>'):index.index('</header>')+9])
          tools = sorted(Path(os.environ['ANDROID_HOME']).glob('build-tools/*/aapt'))
          if tools:
              output = subprocess.check_output([str(tools[-1]),'dump','badging',str(apk)], text=True)
              print(output.splitlines()[0])
          PY
