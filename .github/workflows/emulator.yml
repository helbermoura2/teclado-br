name: Verificar teclado no Android
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/emulator_smoke.py'
      - '.github/workflows/emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/emulator_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teclado-br-telas-android
          path: screenshots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: teclado-br-apk-verificado
          path: app/build/outputs/apk/debug/app-debug.apk
