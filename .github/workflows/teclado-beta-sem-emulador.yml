name: Teclado BR 0.9.2 beta - APK sem emulador
# Updating this workflow once creates beta 4. Other changes do not run this
# expensive workflow. The official 0.9.1 release remains untouched.
on:
  push:
    branches:
      - feat/compact-edit-toolbar-0.9.2-20261108
    paths:
      - .github/workflows/teclado-beta-sem-emulador.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: teclado-br-beta-092
  cancel-in-progress: false

jobs:
  beta:
    if: github.repository == 'helbermoura2/teclado-br' && github.ref == 'refs/heads/feat/compact-edit-toolbar-0.9.2-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout da proposta 0.9.2
        uses: actions/checkout@v4

      - name: Confirmar versão beta e base fixada
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          lock = json.loads(pathlib.Path("heliboard/upstream.json").read_text())
          assert lock["trial_version"] == "0.9.2-beta.4-heli3.6", lock["trial_version"]
          assert lock["commit"] == "f8ec91a982835911cc224fa99434c3396d4cd562"
          print("Build beta aprovado para a versão 0.9.2, sem merge na main.")
          PY
          python3 -m compileall -q heliboard
          bash -n heliboard/ci/preload-robolectric.sh
          bash -n heliboard/ai/build-native.sh

      - uses: actions/checkout@v4
        with:
          repository: HeliBorg/HeliBoard
          ref: f8ec91a982835911cc224fa99434c3396d4cd562
          path: heli-source

      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 0ec4027a2a0183de87c007069adddc06e665f7de
          path: heli-source/ai-native/llama.cpp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.0.13004108'
          log-accepted-android-sdk-licenses: false

      - name: Reusar identidade de assinatura anterior
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: teclado-br-heli-test-signing-v2

      - name: Restaurar assinatura sem gerar certificado diferente
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 heliboard/signing.py

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar o teclado 0.9.2
        run: |
          python3 heliboard/prepare.py heli-source
          mkdir -p beta-package
          tar --exclude=.git --exclude=build --exclude=.gradle --exclude=ai-build --exclude='*.gguf' -czf beta-package/teclado-br-heli-0.9.2-beta.4-fontes.tar.gz -C heli-source .

      - name: Reutilizar motor de IA offline compilado
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: heli-source/app/src/main/jniLibs/
          key: tecladoai-ndk28-b12020-${{ hashFiles('heliboard/ai/native/**', 'heliboard/ai/build-native.sh') }}

      - name: Preparar compilação nativa apenas sem cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache-ai
        run: |
          if ! command -v ccache >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ccache
          fi
          ccache --max-size=2G
          ccache --set-config=compiler_check=content

      - name: Restaurar objetos nativos se necessário
        id: native-objects
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ccache-ai/
          key: tecladoai-objects-ndk28-b12020-v1

      - name: Compilar IA offline apenas sem cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache-ai
        run: bash heliboard/ai/build-native.sh heli-source

      - name: Guardar motor IA reutilizável
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: heli-source/app/src/main/jniLibs/
          key: tecladoai-ndk28-b12020-${{ hashFiles('heliboard/ai/native/**', 'heliboard/ai/build-native.sh') }}

      - name: Cache Robolectric Android 15 (testes JVM, sem emulador)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented/15-robolectric-12650502-i7
          key: teclado-br-robolectric-4.14.1-android35-i7-v1

      - name: Verificar runtime Robolectric e SHA-512
        run: bash heliboard/ci/preload-robolectric.sh

      - name: Compilar APK e executar testes unitários
        working-directory: heli-source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testRunTestsUnitTest assembleDebugNoMinify

      - name: Verificar certificado igual ao da 0.9.1
        run: python3 heliboard/verify_signing.py

      - name: Preparar APK de teste e hashes
        shell: bash
        run: |
          set -euo pipefail
          apk=(heli-source/app/build/outputs/apk/debugNoMinify/*.apk)
          test -f "${apk[0]}"
          cp "${apk[0]}" beta-package/teclado-br-heli-0.9.2-beta.4.apk
          (cd beta-package && sha256sum teclado-br-heli-0.9.2-beta.4.apk teclado-br-heli-0.9.2-beta.4-fontes.tar.gz > sha256-0.9.2-beta.4.txt)
          echo "## Teclado BR 0.9.2 beta" >> "$GITHUB_STEP_SUMMARY"
          echo "APK compilado, testes JVM passaram e certificado verificado." >> "$GITHUB_STEP_SUMMARY"
          echo "**O emulador não foi executado.** Ações de edição exigem teste real no Nothing Phone (1)." >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar somente pre-release beta (nunca atualiza main)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="heli-0.9.2-beta.4"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::A beta já existe. Não sobrescrever APK publicado; usar uma nova versão beta."
            exit 1
          fi
          cat > beta-package/NOTAS.txt <<'NOTAS'
          Teclado BR 0.9.2 beta 4 — APENAS PARA TESTES.
          Barra compacta com cinco atalhos circulares na ordem:
          IA, Prancheta, Emoji, Traduzir e Ajustes, com ⋯ à direita.
          Toque na prancheta abre o histórico; segurar a prancheta
          abre a barra de edição: Selecionar tudo, Copiar, Recortar,
          Colar, Desfazer, Refazer e Voltar aos atalhos principais.
          Traduzir abre diretamente o seletor de idiomas da IA.
          As três sugestões continuam com largura total durante a digitação.
          O botão + de adicionar palavras continua no menu ⋯.
          APK compilado, testes unitários aprovados e assinatura conferida.
          Esta beta não passou pelo emulador Android. Conferir a disposição
          do menu e o atalho de dicionário no telefone real.
          A versão oficial 0.9.1 permanece disponível e inalterada.
          Instale por cima da 0.9.1; não desinstale para não perder dados.
          NOTAS
          gh release create "$tag" --target "$GITHUB_SHA" \
            --prerelease --title 'Teclado BR 0.9.2 beta 4 — teste sem emulador' \
            --notes-file beta-package/NOTAS.txt \
            beta-package/teclado-br-heli-0.9.2-beta.4.apk \
            beta-package/teclado-br-heli-0.9.2-beta.4-fontes.tar.gz \
            beta-package/sha256-0.9.2-beta.4.txt
          echo "### Prévia publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
