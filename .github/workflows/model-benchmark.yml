name: Comparar modelos offline em português
on:
  push:
    branches: [main]
    paths: ['benchmarks/**', '.github/workflows/model-benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qwen3-4b
            repo: Qwen/Qwen3-4B-GGUF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar llama.cpp b6500 verificado
        run: |
          curl --fail --location --retry 3 --output llama.zip https://github.com/ggml-org/llama.cpp/releases/download/b6500/llama-b6500-bin-ubuntu-x64.zip
          echo '716803084e565fe779bc2d01ea576c418be141f8fabac97509bc6d7c3cd786b2  llama.zip' | sha256sum --check
          unzip -q llama.zip -d llama
      - name: Executar tarefas sintéticas em CPU
        run: python benchmarks/run_models.py --repo '${{ matrix.repo }}' --name '${{ matrix.name }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modelo-${{ matrix.name }}
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30
