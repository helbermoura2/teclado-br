name: Teclado BR One UI preview
on:
  pull_request:
    paths: ['heliboard/**', '.github/workflows/teclado-oneui-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
# Keep only the newest expensive Android emulator build per pull request.
concurrency:
  group: teclado-oneui-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HeliBorg/HeliBoard
          ref: f8ec91a982835911cc224fa99434c3396d4cd562
          path: heli-source
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 0ec4027a2a0183de87c007069adddc06e665f7de
          path: heli-source/ai-native/llama.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.0.13004108'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: teclado-br-heli-test-signing-v2
      - name: Restaurar assinatura de teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 heliboard/signing.py
      # The signing key is restored from existing private backup/cache; do NOT
      # create a new key artifact on every PR validation run.
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar variante brasileira e fontes correspondentes
        run: |
          python3 heliboard/prepare.py heli-source
          mkdir -p heli-artifacts
          tar --exclude=.git --exclude=build --exclude=.gradle --exclude=ai-build --exclude='*.gguf' -czf heli-artifacts/teclado-br-heli-fontes.tar.gz -C heli-source .
      - name: Recuperar motor offline compilado
        uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: heli-source/app/src/main/jniLibs/
          key: tecladoai-ndk28-b12020-${{ hashFiles('heliboard/ai/native/**', 'heliboard/ai/build-native.sh') }}
      - name: Preparar cache de compilação nativa
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache-ai
        run: |
          if ! command -v ccache >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ccache
          fi
          ccache --max-size=2G
          ccache --set-config=compiler_check=content
      - uses: actions/cache/restore@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        id: native-objects
        with:
          path: .ccache-ai/
          key: tecladoai-objects-ndk28-b12020-v1
      - name: Compilar motor offline para Android
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache-ai
        run: bash heliboard/ai/build-native.sh heli-source
      - name: Guardar cache de objetos nativos
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.native-objects.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache-ai/
          key: tecladoai-objects-ndk28-b12020-v1
      - name: Guardar motor offline compilado
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: heli-source/app/src/main/jniLibs/
          key: tecladoai-ndk28-b12020-${{ hashFiles('heliboard/ai/native/**', 'heliboard/ai/build-native.sh') }}
      - name: Testar e compilar a base
        working-directory: heli-source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testRunTestsUnitTest assembleDebugNoMinify
      - name: Conferir certificado do APK
        run: python3 heliboard/verify_signing.py
      # Unit tests are verified in the Gradle build step and retained in the run log.
      # Keep their HTML/XML reports locally for the combined diagnostic package.
      - name: Preparar arquivos para teste no mesmo runner
        run: |
          mkdir -p heli-package
          cp heli-source/app/build/outputs/apk/debugNoMinify/*.apk heli-package/
          cp heli-artifacts/teclado-br-heli-fontes.tar.gz heli-package/
      - name: Liberar arquivos temporários da compilação
        run: |
          cp -r heli-source/app/build/reports/tests heli-package/unit-tests
          rm -rf heli-source/app/build heli-source/app/.cxx "$ANDROID_HOME/ndk/28.0.13004108"
          df -h .
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        with:
          path: /tmp/qwen-smoke.gguf
          key: teclado-br-qwen-smoke-9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031
      - name: Baixar fixture sintética para teste offline
        run: |
          if [ ! -f /tmp/qwen-smoke.gguf ]; then
            curl --fail --location --retry 3 --output /tmp/qwen-smoke.gguf 'https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/23749fefcc72300e3a2ad315e1317431b06b590a/Qwen3-0.6B-Q8_0.gguf?download=true'
          fi
          echo '9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031  /tmp/qwen-smoke.gguf' | sha256sum -c -
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_5
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            adb shell wm size 540x1170
            adb shell wm density 220
            adb install -r $(find heli-package -name '*.apk' -print -quit)
            python3 heliboard/smoke.py
      - name: Guardar diagnóstico compacto da prévia (1 dia)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          retention-days: 1
          compression-level: 9
          name: teclado-br-oneui-previa-${{ github.run_id }}
          path: |
            heli-results/
            heli-package/unit-tests/
          if-no-files-found: ignore
