name: CENA local visual AI on Android
on:
  push:
    branches: ['cena/**']
    paths: ['.github/workflows/cena-android.yml', '.github/workflows/cena-vision-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  local-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
      - name: Prepare bundled free visual model
        working-directory: cena
        run: python3 scripts/prepare-vision-model.py
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - name: Prepare pinned local GGUF runtime
        run: |
          sdkmanager 'ndk;28.0.13004108'
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git /tmp/cena-llama
          git -C /tmp/cena-llama fetch --depth 1 origin 0ec4027a2a0183de87c007069adddc06e665f7de
          git -C /tmp/cena-llama checkout --detach FETCH_HEAD
          mkdir -p cena/android/app/src/main/assets/licenses
          cp /tmp/cena-llama/LICENSE cena/android/app/src/main/assets/licenses/llama.cpp.txt
      - uses: actions/cache@v4
        id: local-runtime
        with:
          path: cena/android/app/src/main/jniLibs
          key: cena-llama-b12020-ndk28-${{ hashFiles('cena/android/app/src/main/cpp/**', 'cena/scripts/build-local-ai.sh') }}
      - name: Compile local CPU engine for Android
        if: steps.local-runtime.outputs.cache-hit != 'true'
        run: bash cena/scripts/build-local-ai.sh cena /tmp/cena-llama
      - name: Remove unused native debug symbols
        run: bash cena/scripts/trim-native.sh cena
      - name: Restore the same persistent signing identity as delivery
        env:
          GH_TOKEN: ${{ github.token }}
          CENA_KEYSTORE_PATH: ${{ runner.temp }}/cena-signing/cena-preview.keystore
        run: bash cena/scripts/prepare-signing.sh
      - name: Compile the APK and focused model test
        working-directory: cena/android
        env:
          CENA_KEYSTORE_PATH: ${{ runner.temp }}/cena-signing/cena-preview.keystore
        run: gradle --no-daemon -PcenaAbi=x86_64 assembleDebug assembleDebugAndroidTest
      - name: Download CENA IA 0.7.2 for a real signed update test
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download cena-v0.7.2 --repo "$GITHUB_REPOSITORY" --pattern CENA-0.7.2.apk --dir /tmp/cena-previous
      - name: Download verified runtime test model (never bundled)
        run: |
          curl -fL --retry 3 'https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/23749fefcc72300e3a2ad315e1317431b06b590a/Qwen3-0.6B-Q8_0.gguf?download=true' -o /tmp/cena-smoke.gguf
          echo '9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031  /tmp/cena-smoke.gguf' | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096 -partition-size 4096
          disable-animations: true
          working-directory: cena/android
          script: |
            adb install -r /tmp/cena-previous/CENA-0.7.2.apk
            adb shell run-as app.cena.mobile mkdir -p files
            adb shell "run-as app.cena.mobile sh -c 'echo update > files/legacy-update-marker.txt'"
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p ../qa
            adb push /tmp/cena-smoke.gguf /data/local/tmp/cena-smoke.gguf
            adb shell run-as app.cena.mobile.test mkdir -p files
            adb shell run-as app.cena.mobile.test cp /data/local/tmp/cena-smoke.gguf files/smoke.gguf
            adb shell run-as app.cena.mobile.test chmod 600 files/smoke.gguf
            adb shell content call --uri content://app.cena.mobile.test.model/model --method grant
            adb shell content query --uri content://app.cena.mobile.test.model/model
            timeout 420s adb shell am instrument -w -r -e class app.cena.AssetsUpgradeTest,app.cena.StoryExportTest,app.cena.StoryArtworkTest,app.cena.TraktRepositoryTest,app.cena.StremioRepositoryTest,app.cena.SeriesRepositoryTest,app.cena.CoverRecognitionTest,app.cena.VisualModelTest,app.cena.LocalAiTest,app.cena.NuvioRepositoryTest,app.cena.WatchHistoryTest app.cena.mobile.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/cena-instrumentation.txt
            adb shell dumpsys activity lastanr > ../qa/native-last-anr.txt
            if ! grep -F 'OK (27 tests)' /tmp/cena-instrumentation.txt > /dev/null; then adb logcat -d -s AndroidRuntime:E; adb root; adb wait-for-device; adb shell 'cat /data/anr/*' > ../qa/native-anr-traces.txt; fi
            grep -F 'OK (27 tests)' /tmp/cena-instrumentation.txt
            adb shell run-as app.cena.mobile cat files/legacy-update-marker.txt | grep -x update
            mkdir -p ../qa
            adb exec-out run-as app.cena.mobile cat files/native-ocr.json > ../qa/native-ocr.json
            adb exec-out run-as app.cena.mobile cat files/story-with-poster.png > ../qa/story-with-poster.png
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Identify the two actual photos using the real Android OCR output
        working-directory: cena
        run: node scripts/check-native-cover-identification.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CENA-local-visual-model-report
          path: |
            cena/qa/native-ocr.json
            cena/qa/native-last-anr.txt
            cena/qa/native-anr-traces.txt
            cena/qa/story-with-poster.png
            cena/android/app/build/reports/androidTests/connected/**

