name: CENA live mobile browser QA
# Includes title-specific similarity and optional local-model UI validation.
on:
  push:
    branches: ['cena/**']
    paths: ['.github/workflows/cena-browser-qa.yml', '.github/workflows/cena-android.yml', 'cena/web/app.js']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare browser driver
        run: |
          python3 -m venv /tmp/cena-browser
          /tmp/cena-browser/bin/pip install playwright
      - name: Search SISU online and save to the local watchlist
        working-directory: cena
        run: |
          /tmp/cena-browser/bin/python - <<'PY'
          import os, re, shutil, subprocess, tempfile, time, urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright, expect
          env = dict(os.environ, DATA_DIR=tempfile.mkdtemp(prefix='cena-browser-'))
          server = subprocess.Popen(['node', 'server/index.mjs'], env=env)
          try:
              for attempt in range(50):
                  try:
                      urllib.request.urlopen('http://127.0.0.1:3000/api/config', timeout=1)
                      break
                  except Exception:
                      time.sleep(.2)
              with sync_playwright() as p:
                  executable = shutil.which('google-chrome') or shutil.which('chromium')
                  assert executable, 'A preinstalled Chrome browser is required.'
                  browser = p.chromium.launch(executable_path=executable, args=['--no-sandbox'])
                  page = browser.new_page(viewport={'width': 412, 'height': 915}, device_scale_factor=1)
                  errors = []
                  page.on('pageerror', lambda error: errors.append(str(error)))
                  page.add_init_script("localStorage.setItem('cena.connection.v1', JSON.stringify({apiBase:'local'}))")
                  page.goto('http://127.0.0.1:3000', wait_until='networkidle')
                  page.locator('nav [data-tab="library"]').click()
                  page.locator('#query').fill('SISU')
                  page.locator('#search-form button').click()
                  card = page.locator('#search-results .poster-card').filter(has_text=re.compile('sisu', re.I)).first
                  expect(card).to_be_visible(timeout=60000)
                  card.click()
                  page.locator('#add-title').click()
                  expect(page.locator('.status-label')).to_contain_text('Quero assistir', timeout=10000)
                  page.locator('#detail .close').click()
                  page.locator('nav [data-tab="library"]').click()
                  expect(page.locator('#library-grid')).to_contain_text(re.compile('sisu', re.I))
                  page.locator('nav [data-tab="scan"]').click()
                  expect(page.locator('#pick-image')).to_be_visible()
                  with page.expect_file_chooser() as chosen:
                      page.locator('#pick-image').click()
                  import base64
                  chosen.value.set_files({'name': 'print.png', 'mimeType': 'image/png', 'buffer': base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jWp8AAAAASUVORK5CYII=')})
                  expect(page.locator('.scan-frame img')).to_be_visible()
                  page.evaluate("window.CenaNativeResult({lines:['TEXTO DA LEGENDA','SISU']})")
                  page.locator('[data-line="1"]').click()
                  expect(page.locator('#search-results .poster-card').filter(has_text=re.compile('sisu', re.I)).first).to_be_visible(timeout=60000)
                  page.locator('#search-results .poster-card').filter(has_text=re.compile('sisu', re.I)).first.click()
                  expect(page.locator('#detail')).to_be_visible()
                  page.evaluate("window.CenaNativeResult({lines:['SISU']})")
                  expect(page.locator('#detail')).not_to_be_visible()
                  expect(page.locator('#search-results .poster-card').filter(has_text=re.compile('sisu', re.I)).first).to_be_visible(timeout=60000)
                  expect(page.locator('#app-version')).to_contain_text('0.28.1')
                  page.evaluate("window.CenaNativeResult({lines:['LSMARSHAIG','TOMMY LEE JONES','WESLEY SNIPES','ROBERT DOWNEY JR.']})")
                  recovered = page.locator('#search-results .poster-card[data-id="tt0120873"]')
                  expect(recovered).to_be_visible(timeout=60000)
                  recovered.click()
                  expect(page.locator('#detail-content')).to_contain_text('1998')
                  page.locator('#add-title').click()
                  expect(page.locator('.status-label')).to_contain_text('Quero assistir', timeout=10000)
                  page.locator('#detail .close').click()
                  page.evaluate("window.CenaNativeResult({lines:['Margahet.','Are You','There God?', \"It's Me,\"],phrases:[\"Are You There God? It's Me, Margahet.\"]})")
                  margaret = page.locator('#search-results .poster-card[data-id="tt9185206"]')
                  expect(margaret).to_be_visible(timeout=60000)
                  margaret.click()
                  expect(page.locator('#detail-content')).to_contain_text('2023')
                  page.locator('#detail .close').click()
                  page.evaluate("window.CenaNativeResult({title:'Jheye God9 ItsMe, Margatet.',lines:['Margatet.','Jheye God9','ItsMe,'],phrases:['Jheye God9 ItsMe, Margatet.']})")
                  expect(page.locator('#scan-query')).to_have_value('Jheye God9 ItsMe, Margatet.')
                  expect(page.locator('#detected-lines [data-line]')).to_have_count(0)
                  expect(page.locator('#search-results .poster-card').first).to_have_attribute('data-id', 'tt9185206', timeout=60000)
                  expect(page.locator('#scan-query')).to_have_value(re.compile(r"^Are You There God\? It's Me, Margaret\.?\s*$"))
                  page.locator('#search-results .poster-card[data-id="tt9185206"]').click()
                  expect(page.locator('#detail-content')).to_contain_text('2023')
                  page.locator('#detail .close').click()
                  page.locator('nav [data-tab="library"]').click()
                  page.locator('#query').fill('AVES DE RAPINA')
                  page.locator('#search-form button').click()
                  birds = page.locator('#search-results .poster-card[data-id="tt7713068"]')
                  expect(birds).to_be_visible(timeout=60000)
                  birds.locator('.poster-art').click()
                  expect(page.locator('#detail')).to_be_visible()
                  expect(page.locator('#detail-content')).to_contain_text('2020')
                  expect(page.locator('#detail-content')).to_contain_text('Margot Robbie', timeout=30000)
                  expect(page.locator('#detail-content')).to_contain_text('Duração:',timeout=30000)
                  assert len(page.locator('#detail-synopsis').inner_text()) > 100
                  Path('qa').mkdir(exist_ok=True)
                  page.screenshot(path='qa/birds-details.png', full_page=True)
                  page.locator('#detail .close').click()
                  page.locator('#detail').evaluate('(dialog) => dialog.open && dialog.close()')
                  native_page = browser.new_page(viewport={'width':412,'height':915})
                  native_page.add_init_script("""
                    localStorage.setItem('cena.connection.v1',JSON.stringify({apiBase:'local'}));
                    localStorage.setItem('cena.local.items.v1',JSON.stringify([{id:'tt14846026',type:'movie',name:'Sisu',year:'2022',status:'watchlist'}]));
                    window.traktBatches=[];window.stremioAuthorized=false;
                    window.stremioRows=[
                      {id:'tt14846026',type:'movie',name:'Sisu',removed:false,temp:false},
                      {id:'tt0172495',type:'movie',name:'Gladiator',year:'2000',removed:false,temp:false},
                      {id:'tt0903747',type:'series',name:'Breaking Bad',removed:false,temp:false},
                      {id:'kitsu:123',type:'series',name:'Anime custom ID',removed:false,temp:false}];
                    window.CenaAndroid={appVersion:()=> '0.23.0',ready:()=>{},traktInventory:()=>{},queueTraktBatch:raw=>window.traktBatches.push(JSON.parse(raw)),queueTrakt:()=>{},
                      connectStremio:()=>window.CenaStremioResult({connected:false,pairing:true,library:[]}),
                      openStremioAuthorization:()=>window.stremioAuthorized=true,
                      readStremioLibrary:()=>window.CenaStremioResult({connected:true,pairing:false,account:'t***@example.org',lastRead:Date.now(),library:window.stremioRows}),
                      disconnectStremio:()=>window.CenaStremioResult({connected:false,pairing:false,library:[]}),cancelStremioReading:()=>{},
                      configureTrakt:()=>window.CenaTraktResult({configured:true,connected:false,pending:[]}),
                      connectTrakt:()=>window.CenaTraktResult({configured:true,connected:false,pending:[],userCode:'CENA-CODE',verificationUrl:'https://trakt.tv/activate'}),
                      loadStoryArtwork:(requestId)=>setTimeout(()=>{
                        if(window.failStoryArtwork){window.CenaStoryArtworkResult({requestId,status:'unavailable'});return;}
                        const canvas=document.createElement('canvas');canvas.width=300;canvas.height=450;const ctx=canvas.getContext('2d');ctx.fillStyle='#1b6587';ctx.fillRect(0,0,300,450);ctx.fillStyle='#e7b878';ctx.fillRect(40,70,180,250);
                        window.CenaStoryArtworkResult({requestId,status:'ok',image:canvas.toDataURL('image/jpeg'),sourceUrl:'https://images.metahub.space/poster/medium/tt14846026/img'});
                      },200),
                      saveStory:value=>window.savedStory=value,shareStory:value=>window.sharedStory=value};
                  """)
                  native_page.goto('http://127.0.0.1:3000',wait_until='networkidle')
                  native_page.locator('#profile-shortcut').click()
                  native_page.locator('summary').filter(has_text='Configurar integração').click()
                  native_page.locator('#trakt-client-id').fill('cena-public-test-client-0000000000')
                  native_page.locator('#trakt-config-form button').click()
                  native_page.locator('#trakt-connect').click()
                  expect(native_page.locator('#trakt-user-code')).to_have_text('CENA-CODE')
                  native_page.evaluate("window.CenaTraktResult({configured:true,connected:true,username:'test-owner',lastSync:1700000000000,pending:[],watchlist:[],watched:[{id:'tt14846026',type:'movie',watchedAt:'2026-11-01T12:00:00Z'}]})")
                  native_page.locator('nav [data-tab="library"]').click()
                  native_page.locator('[data-filter="watched"]').click()
                  expect(native_page.locator('#library-grid')).to_contain_text('✓ Assistido')
                  native_page.locator('#library-grid .poster-card').first.click()
                  native_page.locator('#share-title').click()
                  expect(native_page.locator('#story-caption')).to_have_value('')
                  native_page.locator('#story-rating').fill('11')
                  expect(native_page.locator('#share-story')).to_be_disabled()
                  native_page.locator('#story-rating').fill('8.53')
                  expect(native_page.locator('#story-rating-error')).not_to_be_visible()
                  expect(native_page.locator('#story-canvas')).to_have_attribute('data-story-rating','8.53')
                  native_page.locator('#story-rating').fill('8,53')
                  native_page.locator('#story-caption').fill('Uma história excelente, com atuações marcantes.')
                  native_page.locator('#story-title').fill('Sisu')
                  expect(native_page.locator('#story-canvas')).to_have_attribute('data-story-rating','8.53')
                  expect(native_page.locator('#story-canvas')).to_have_attribute('data-layout-version','29')
                  assert native_page.locator('#story-canvas').get_attribute('width')=='1080'
                  assert native_page.locator('#story-canvas').get_attribute('height')=='1920'
                  expect(native_page.locator('#story-status')).to_have_attribute('data-state','ready')
                  expect(native_page.locator('#story-canvas')).to_have_attribute('data-poster-loaded','true')
                  native_page.locator('#save-story').click()
                  native_page.wait_for_function('window.savedStory && window.savedStory.length > 100')
                  import struct
                  png=base64.b64decode(native_page.evaluate('window.savedStory'))
                  assert png[:8]==b'\x89PNG\r\n\x1a\n' and struct.unpack('>II',png[16:24])==(1080,1920)
                  Path('qa/CENA-Story.png').write_bytes(png)
                  native_page.locator('#share-story').click()
                  native_page.wait_for_function('window.sharedStory && window.sharedStory.length > 100')
                  native_page.evaluate('window.failStoryArtwork=true')
                  native_page.locator('#share-title').click()
                  expect(native_page.locator('#share-story')).to_be_disabled()
                  expect(native_page.locator('#story-rating')).to_have_value('8,53')
                  expect(native_page.locator('#story-caption')).to_have_value('Uma história excelente, com atuações marcantes.')
                  expect(native_page.locator('#story-status')).to_have_attribute('data-state','error')
                  expect(native_page.locator('#save-story')).to_be_disabled()
                  expect(native_page.locator('#story-without-poster')).to_be_visible()
                  native_page.locator('#story-without-poster').click()
                  expect(native_page.locator('#share-story')).to_be_enabled()
                  expect(native_page.locator('#story-status')).to_have_attribute('data-state','title-only')
                  native_page.evaluate('window.failStoryArtwork=false')
                  native_page.locator('#retry-story').click()
                  expect(native_page.locator('#story-status')).to_have_attribute('data-state','ready')
                  native_page.locator('#detail .close').click()
                  native_page.locator('#profile-shortcut').click()
                  native_page.locator('#stremio-connect').click()
                  expect(native_page.locator('#stremio-authorize')).to_be_visible()
                  native_page.locator('#stremio-authorize').click()
                  assert native_page.evaluate('window.stremioAuthorized') is True
                  native_page.evaluate("window.CenaStremioResult({connected:true,account:'t***@example.org',library:[]})")
                  native_page.locator('#stremio-read').click()
                  expect(native_page.locator('#stremio-summary')).to_have_text('2 novos · 1 já no CENA · 1 sem identificador compatível.')
                  expect(native_page.locator('#stremio-trakt')).not_to_be_checked()
                  native_page.locator('#stremio-filter').fill('breaking')
                  expect(native_page.locator('#stremio-rows .stremio-row')).to_have_count(1)
                  native_page.locator('#stremio-filter').fill('')
                  native_page.locator('#stremio-import').click()
                  expect(native_page.locator('#stremio-summary')).to_have_text('0 novos · 3 já no CENA · 1 sem identificador compatível.')
                  imported=native_page.evaluate("JSON.parse(localStorage.getItem('cena.local.items.v1'))")
                  assert len(imported)==3
                  assert next(item for item in imported if item['id']=='tt14846026')['status']=='watched'
                  assert next(item for item in imported if item['id']=='tt0903747')['status']=='watchlist'
                  assert native_page.evaluate('window.traktBatches.length')==0, 'Import must not silently send the whole library to Trakt'
                  expect(native_page.locator('#stremio-import')).to_be_disabled()
                  native_page.locator('#stremio-read').click()
                  expect(native_page.locator('#stremio-import')).to_be_disabled()
                  native_page.evaluate("window.stremioRows.push({id:'tt0120873',type:'movie',name:'U.S. Marshals',removed:false,temp:false})")
                  native_page.locator('#stremio-read').click()
                  expect(native_page.locator('#stremio-summary')).to_contain_text('1 novos')
                  native_page.locator('#stremio-trakt').check()
                  native_page.locator('#stremio-import').click()
                  native_page.wait_for_function('window.traktBatches.length===1')
                  assert native_page.evaluate('window.traktBatches[0]')==[{'id':'tt0120873','type':'movie','action':'add'}]
                  native_page.screenshot(path='qa/stremio-import.png',full_page=True)
                  native_page.locator('#stremio-disconnect').click()
                  expect(native_page.locator('#stremio-connect')).to_be_visible()
                  assert len(native_page.evaluate("JSON.parse(localStorage.getItem('cena.local.items.v1'))"))==4
                  print('Stremio preview and selected import preserve watched records, deduplicate, keep custom IDs visible, and only send new titles to Trakt when explicitly checked. Provider authorization is mocked in this browser test.')
                  native_page.close()
                  scroll_page=browser.new_page(viewport={'width':412,'height':915})
                  scroll_page.on('pageerror',lambda error:errors.append(str(error)))
                  scroll_page.route('https://**/*',lambda route:route.fulfill(status=200,content_type='image/png',body=png) if route.request.resource_type=='image' else route.fulfill(status=200,content_type='application/json',body='{}'))
                  scroll_page.add_init_script("""
                    localStorage.setItem('cena.connection.v1',JSON.stringify({apiBase:'local'}));
                    localStorage.setItem('cena.local.items.v1',JSON.stringify(Array.from({length:110},(_,i)=>({id:'tt'+(9000000+i),type:'movie',name:'Saved film '+i,status:'watchlist',poster:'https://image.tmdb.org/fixture.jpg'}))));
                    window.CenaAndroid={appVersion:()=> '0.23.0',ready:()=>{},traktInventory:()=>{}};
                  """)
                  scroll_page.goto('http://127.0.0.1:3000',wait_until='networkidle')
                  scroll_page.locator('nav [data-tab="library"]').click()
                  scroll_page.locator('[data-filter="all"]').click()
                  scroll_page.locator('#query').fill('rascunho preservado')
                  scroll_page.evaluate("document.querySelector('#search-results').innerHTML='<p id=search-sentinel>Resultados preservados</p>'")
                  scroll_page.locator('#library-grid .poster-card').nth(40).scroll_into_view_if_needed()
                  scroll_page.wait_for_timeout(1000)
                  before=scroll_page.evaluate("window.savedCard=document.querySelector('#library-grid .poster-card[data-id=tt9000040]');window.savedImage=savedCard.querySelector('img');window.scrollY")
                  assert before>1000
                  scroll_page.evaluate("window.CenaTraktResult({configured:true,connected:true,lastSync:1700000000000,pending:[],watchlist:[],watched:[]})")
                  assert abs(scroll_page.evaluate('window.scrollY')-before)<3, 'Timestamp-only sync must not jump to the top'
                  expect(scroll_page.locator('#query')).to_have_value('rascunho preservado')
                  scroll_page.evaluate("window.CenaTraktResult({configured:true,connected:true,lastSync:1700000001000,pending:[],watchlist:[{id:'tt9991234',type:'movie',name:'Remote new film'}],watched:[{id:'tt9000040',type:'movie',watchedAt:'2026-11-02T00:00:00Z'}]})")
                  assert abs(scroll_page.evaluate('window.scrollY')-before)<3, 'Actual library changes must preserve the visible card position'
                  assert scroll_page.evaluate("window.savedCard===document.querySelector('#library-grid .poster-card[data-id=tt9000040]') && window.savedImage===savedCard.querySelector('img')"), 'Existing cards and loaded images must be reused'
                  expect(scroll_page.locator('#library-grid .poster-card')).to_have_count(111)
                  expect(scroll_page.locator('#query')).to_have_value('rascunho preservado')
                  expect(scroll_page.locator('#search-sentinel')).to_have_text('Resultados preservados')
                  expect(scroll_page.locator('#library-grid .poster-card[data-id="tt9000040"] .badge')).to_have_text('✓ Assistido')
                  scroll_page.screenshot(path='qa/catalog-scroll-preserved.png',full_page=False)
                  scroll_page.close()
                  print('Scroll, search draft/results, and existing image nodes preserved across timestamp-only and actual Trakt updates.')
                  discovery_page=browser.new_page(viewport={'width':412,'height':915})
                  discovery_page.on('pageerror',lambda error:errors.append(str(error)))
                  pending_refresh=[]
                  refresh_mode={'value':'normal'}
                  def discovery_route(route):
                      if '/catalog/' in route.request.url and refresh_mode['value']!='normal':
                          if refresh_mode['value']=='offline':route.abort()
                          else:pending_refresh.append(route)
                          return
                      if route.request.resource_type=='image':route.fulfill(status=200,content_type='image/png',body=png)
                      else:
                          match=re.search(r'/meta/(movie|series)/(tt[0-9]+)',route.request.url)
                          route.fulfill(status=200,content_type='application/json',body=__import__('json').dumps({'meta':{'id':match.group(2),'type':match.group(1),'name':'Public metadata','genres':['Crime','Drama'],'description':'Ficha técnica de teste','poster':'https://image.tmdb.org/fixture.jpg'}}) if match else '{}')
                  discovery_page.route('https://**/*',discovery_route)
                  discovery_page.add_init_script("""
                    const at=Date.now();
                    const saved=[{id:'tt0000001',type:'movie',name:'Favorito policial',genres:['Crime','Drama'],status:'watched'},{id:'tt0903747',type:'series',name:'Breaking Bad',genres:['Crime','Drama'],status:'watchlist',watchedEpisodes:2}];
                    localStorage.setItem('cena.connection.v1',JSON.stringify({apiBase:'local'}));localStorage.setItem('cena.local.items.v1',JSON.stringify(saved));
                    localStorage.setItem('cena.story.notes.v1',JSON.stringify({'movie:tt0000001':{rating:'9'}}));
                    localStorage.setItem('cena.discovery.profiles.v1',JSON.stringify(Object.fromEntries(saved.map(item=>[item.type+':'+item.id,{at,item}]))));
                    localStorage.setItem('cena.discovery.catalog.v1',JSON.stringify({at,genreKey:'Crime|Drama',source:'Test catalog',items:[...saved,{id:'tt0000002',type:'movie',name:'Nova indicação policial',genres:['Crime','Drama'],year:'2020',poster:'https://image.tmdb.org/fixture.jpg'},{id:'tt0000003',type:'series',name:'Nova série policial',genres:['Crime','Drama'],year:'2020',poster:'https://image.tmdb.org/fixture.jpg'}]}));
                    window.discoveryActions=[];
                    window.demoSeries={items:[{id:'tt0903747',aired:3,completed:2,available:1,newEpisodes:1,checkedAt:at,next:{season:1,number:3,title:'Episódio disponível',firstAired:'2008-02-10T00:00:00Z'}}],lastCheck:at,pending:0};
                    window.CenaAndroid={appVersion:()=> '0.23.0',traktInventory:()=>{},queueTrakt:raw=>window.discoveryActions.push(JSON.parse(raw)),
                      ready:()=>queueMicrotask(()=>{window.CenaTraktResult({connected:true,configured:true,username:'test',lastSync:at,pending:[],watchlist:[],watched:[],progress:[{id:'tt0903747',type:'series',episodes:2}]});window.CenaSeriesResult(window.demoSeries);}),
                      refreshSeries:()=>{window.CenaTraktResult({connected:true,configured:true,username:'test',lastSync:Date.now(),pending:[],watchlist:[],watched:[],progress:[{id:'tt0903747',type:'series',episodes:3}]});window.CenaSeriesResult({items:[{id:'tt0903747',aired:3,completed:3,available:0,newEpisodes:0,checkedAt:Date.now(),next:{season:2,number:1,firstAired:new Date(Date.now()+30*86400000).toISOString()}}],lastCheck:Date.now(),pending:0});}};
                  """)
                  discovery_page.goto('http://127.0.0.1:3000',wait_until='domcontentloaded')
                  expect(discovery_page.locator('nav button')).to_have_count(5)
                  camera=discovery_page.locator('nav .camera-nav').bounding_box()
                  assert abs(camera['x']+camera['width']/2-206)<2, 'Camera must occupy the exact center of the five tabs'
                  expect(discovery_page.locator('#series-home')).to_contain_text('T1 · E3')
                  expect(discovery_page.locator('#series-home')).to_contain_text('1 novo episódio')
                  discovery_page.locator('nav [data-tab="discover"]').click()
                  expect(discovery_page.locator('#recommendation-grid .poster-card')).to_have_count(2,timeout=30000)
                  expect(discovery_page.locator('#recommendation-grid .poster-card[data-id="tt0000001"]')).to_have_count(0)
                  expect(discovery_page.locator('#recommendation-grid')).to_contain_text('em comum')
                  discovery_page.locator('[data-discovery-filter="series"]').click()
                  expect(discovery_page.locator('#recommendation-grid .poster-card')).to_have_count(1)
                  discovery_page.locator('[data-discovery-filter="all"]').click()
                  discovery_page.locator('#recommendation-grid .poster-card[data-id="tt0000002"]').click()
                  discovery_page.locator('#add-title').click()
                  expect(discovery_page.locator('.status-label')).to_contain_text('Quero assistir')
                  discovery_page.locator('#detail .close').click()
                  expect(discovery_page.locator('#recommendation-grid .poster-card[data-id="tt0000002"]')).to_have_count(0)
                  assert discovery_page.evaluate('window.discoveryActions')==[{'id':'tt0000002','type':'movie','action':'add'}]
                  discovery_page.locator('[data-discovery-mode="series"]').click()
                  expect(discovery_page.locator('#series-discovery')).to_contain_text('T1 · E3')
                  discovery_page.locator('#series-discovery [data-series-refresh]').click()
